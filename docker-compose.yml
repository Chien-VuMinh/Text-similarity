services:
  frontend:
    build: ./front-end
    image: my-react-app
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./back-end
    image: back-end-backend
    ports:
      - "8000:8000"
    env_file:
      - ./back-end/.env
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: